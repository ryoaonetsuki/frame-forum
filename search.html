<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search &mdash; FRAME</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<script>(function(){try{var a="user_preferred_theme",b="user_preferred_style",h=document.documentElement;h.setAttribute("data-theme",localStorage.getItem(a)||"dark");var s=localStorage.getItem(b);if(s){if(s.indexOf("linear-gradient")===0){var m=s.match(/#([0-9a-f]{6}|[0-9a-f]{3})/i);h.style.setProperty("--keycolor",m?m[0]:"#2970a3");h.style.setProperty("--key-background",s);}else{h.style.setProperty("--keycolor",s);h.style.setProperty("--key-background",s);}}}catch(e){}})();</script>
</head>
<body>
<div id="chrome-header"></div>
<main class="page-wrap"><div class="page-head"><div><h1>Search</h1><p>Find threads across the community.</p></div></div><div class="card"><div class="field" style="margin:0"><input id="sq" placeholder="Type keywords and press Enter..." onkeydown="if(event.key==='Enter')doSearch()"></div></div><div id="res"></div></main>
<div id="chrome-footer"></div>
<div id="chrome-nav"></div>
<div id="chrome-sheet"></div>
<div id="chrome-appearance"></div>
<script src="assets/app.js"></script>
<script>applyTheme();Chrome.mount('home');
var q=new URLSearchParams(location.search);var init=q.get('q')||'';
if(init){document.getElementById('sq').value=init;doSearch();}
window.doSearch=function(){
  var kw=document.getElementById('sq').value.trim().toLowerCase();var d=DB.get();
  if(!kw){document.getElementById('res').innerHTML='';return;}
  var hits=d.threads.filter(function(t){return t.title.toLowerCase().indexOf(kw)>=0||(t.excerpt||'').toLowerCase().indexOf(kw)>=0;});
  document.getElementById('res').innerHTML=hits.length?hits.map(function(t){
    var u=DB.user(t.authorId)||{name:'?',avatar:'',badge:''};
    return '<a class="thread-row" href="thread.html?id='+t.id+'"><img class="thread-avatar" src="'+u.avatar+'"><div class="thread-main"><h3 class="thread-title">'+esc(t.title)+'</h3><div class="thread-meta">'+badgeHTML(u.badge)+statusBadge(t.status)+'<span class="tmeta-text">'+esc(u.name)+' &middot; '+timeAgo(t.createdAt)+'</span></div></div></a>';
  }).join(''):'<div class="empty">No results for &ldquo;'+esc(kw)+'&rdquo;</div>';
};</script>
</body>
</html>
